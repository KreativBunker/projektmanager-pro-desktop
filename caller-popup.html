<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eingehender Anruf</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #ffffff;
      color: #1d1d1f;
      overflow: hidden;
      border: 1px solid #d2d2d7;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      user-select: none;
    }
    .header {
      background: #0073aa;
      color: #fff;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      -webkit-app-region: drag;
    }
    .header .ring {
      width: 18px; height: 18px; flex: 0 0 auto;
    }
    .header .label { font-size: 12px; font-weight: 600; letter-spacing: .3px; text-transform: uppercase; opacity: .95; }
    .header .close {
      margin-left: auto;
      -webkit-app-region: no-drag;
      cursor: pointer;
      width: 22px; height: 22px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 6px;
      font-size: 16px; line-height: 1;
      opacity: .9;
    }
    .header .close:hover { background: rgba(255,255,255,.2); }
    .body {
      padding: 14px;
      flex: 1;
      overflow-y: auto;
    }
    .name { font-size: 19px; font-weight: 700; line-height: 1.2; }
    .firma { font-size: 13px; color: #6e6e73; margin-top: 2px; }
    .meta { font-size: 13px; color: #1d1d1f; margin-top: 8px; }
    .meta .num { font-variant-numeric: tabular-nums; font-weight: 600; }
    .contact-tag {
      display: inline-block; margin-top: 8px;
      background: #eef6fb; color: #0073aa;
      font-size: 12px; font-weight: 600;
      padding: 2px 8px; border-radius: 10px;
    }
    .unknown .name { color: #6e6e73; }
    .projects { margin-top: 12px; }
    .projects .head { font-size: 11px; text-transform: uppercase; letter-spacing: .3px; color: #86868b; margin-bottom: 6px; }
    .project {
      -webkit-app-region: no-drag;
      display: block; width: 100%; text-align: left;
      background: #f5f5f7; border: none; border-radius: 8px;
      padding: 7px 10px; margin-bottom: 6px;
      font-size: 13px; color: #1d1d1f; cursor: pointer;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .project:hover { background: #e8e8ed; }
    .footer {
      padding: 10px 14px; border-top: 1px solid #ececf0;
      display: flex; gap: 8px;
    }
    .btn {
      -webkit-app-region: no-drag;
      flex: 1; padding: 9px; border: none; border-radius: 8px;
      font-size: 13px; font-weight: 600; cursor: pointer;
    }
    .btn-primary { background: #0073aa; color: #fff; }
    .btn-primary:hover { background: #005a87; }
    .btn-secondary { background: #e8e8ed; color: #1d1d1f; }
    .btn-secondary:hover { background: #d2d2d7; }
    .more { font-size: 12px; color: #86868b; margin-top: 8px; }
  </style>
</head>
<body>
  <div class="header">
    <svg class="ring" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"></path>
    </svg>
    <span class="label">Eingehender Anruf</span>
    <div class="close" id="btnClose" title="Schließen">&times;</div>
  </div>

  <div class="body" id="body">
    <div class="name">Anruf…</div>
  </div>

  <div class="footer" id="footer"></div>

  <script src="caller-popup.js"></script>
</body>
</html>
